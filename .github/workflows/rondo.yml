# Rondo for GitHub Actions. Scans for README, CHANGELOG, specs and tests; results go to the job log and the
# Rondo panel. Usage: see README.md.
#
# Repository secrets (from the Rondo panel): RONDO_DOCKER_AUTH_CONFIG (image pull), RONDO_LICENSE (sends results).
# Missing secrets give a warning, not a failure. Disable with repository variable RONDO_DISABLED = true.
# Read-only checkout; registry login in a temp dir; container runs as non-root, repo read-only, no network
# except when sending the result.
name: Rondo

on:
  workflow_call:
    inputs:
      image:
        description: Rondo CLI image
        type: string
        default: registry.workwithrondo.com/rondo/rondo:0.3

permissions:
  contents: read

jobs:
  rondo:
    name: rondo
    if: vars.RONDO_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true # never blocks the pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Rondo scan
        env:
          RONDO_IMAGE: ${{ inputs.image }}
          RONDO_DOCKER_AUTH_CONFIG: ${{ secrets.RONDO_DOCKER_AUTH_CONFIG }}
          RONDO_LICENSE: ${{ secrets.RONDO_LICENSE }}
        run: |
          set -eu
          if [ -z "$RONDO_DOCKER_AUTH_CONFIG" ]; then
            echo "::warning title=Rondo::RONDO_DOCKER_AUTH_CONFIG secret is not set (Rondo panel, license page), scan skipped"
            exit 0
          fi
          RONDO_DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$RONDO_DOCKER_CONFIG"' EXIT
          printf '%s' "$RONDO_DOCKER_AUTH_CONFIG" > "$RONDO_DOCKER_CONFIG/config.json"
          docker --config "$RONDO_DOCKER_CONFIG" pull -q "$RONDO_IMAGE" >/dev/null
          run_rondo() { docker run --rm --user 65532:65532 --network none -v "$GITHUB_WORKSPACE:/repo:ro" "$RONDO_IMAGE" rondo "$@"; }
          run_rondo version
          run_rondo scan /repo
          run_rondo scan --json /repo > "$RUNNER_TEMP/rondo-scan.json"
          if [ -z "$RONDO_LICENSE" ]; then
            echo "::warning title=Rondo::RONDO_LICENSE secret is not set, result only in the log"
            exit 0
          fi
          code=0
          docker run --rm --user 65532:65532 -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e RONDO_LICENSE -e RONDO_API_URL -e GITHUB_ACTIONS -e GITHUB_SERVER_URL -e GITHUB_REPOSITORY \
            -e GITHUB_REPOSITORY_ID -e GITHUB_REF -e GITHUB_REF_NAME -e GITHUB_HEAD_REF -e GITHUB_SHA -e GITHUB_RUN_ID \
            "$RONDO_IMAGE" rondo scan --send /repo > /dev/null || code=$?
          if [ "$code" = 3 ]; then
            echo "::warning title=Rondo::scan done, but the result was not sent to the panel (see log above)"
          fi
          exit "$code"

      - name: Upload rondo-scan.json
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rondo-scan
          path: ${{ runner.temp }}/rondo-scan.json
          if-no-files-found: ignore
          retention-days: 30
