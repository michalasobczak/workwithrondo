# Rondo for GitLab CI (docker executor). Scans for README, CHANGELOG, specs and tests; results go to the job log
# and the Rondo panel. Shell executor: rondo.shell.gitlab-ci.yml.
#
# Setup: CI/CD variables RONDO_LICENSE (masked) and DOCKER_AUTH_CONFIG from the Rondo panel, then:
#   include:
#     - remote: 'https://raw.githubusercontent.com/michalasobczak/workwithrondo/v1/gitlab/rondo.gitlab-ci.yml'
#
# Never blocks the pipeline. Disable with RONDO_DISABLED = "true". Optional AI checks: RONDO_AI_TOKEN.

rondo:
  stage: .pre
  image: registry.workwithrondo.com/rondo/rondo:0.5
  needs: []
  allow_failure: true
  variables:
    GIT_DEPTH: "1"
  script:
    - rondo version
    - rondo scan --json "$CI_PROJECT_DIR" > rondo-scan.json
    - rondo scan --send "$CI_PROJECT_DIR"
  artifacts:
    when: always
    paths: [rondo-scan.json]
    expire_in: 30 days
  rules:
    - if: $RONDO_DISABLED == "true"
      when: never
    - when: always
